# Server
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/servicedesk_db
spring.datasource.username=devops_user
spring.datasource.password=SecureDevOps123!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# We set ddl-auto to 'none' because DevOps will run schema.sql manually
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.postgresql.Dialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false