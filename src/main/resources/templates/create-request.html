<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>New Request</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/dashboard">IT Service Desk</a></div></nav>
<div class="container mt-4">
    <h2>Create New Request</h2>
    <form th:action="@{/requests}" th:object="${request}" method="post">
        <div class="mb-3"><label class="form-label">Title</label><input type="text" th:field="*{title}" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Description</label><textarea th:field="*{description}" class="form-control" rows="4" required></textarea></div>
        <div class="mb-3"><label class="form-label">Priority</label>
            <select th:field="*{priority}" class="form-select">
                <option value="LOW">Low</option><option value="MEDIUM">Medium</option><option value="HIGH">High</option><option value="CRITICAL">Critical</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Submit Request</button>
        <a href="/requests" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
