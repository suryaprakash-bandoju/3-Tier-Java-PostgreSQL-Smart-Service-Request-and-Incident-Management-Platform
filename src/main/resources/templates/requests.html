<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Requests</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/dashboard">IT Service Desk</a></div></nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Service Requests</h2>
        <a href="/requests/new" class="btn btn-success">+ New Request</a>
    </div>
    <table class="table table-striped">
        <thead><tr><th>ID</th><th>Title</th><th>Priority</th><th>Status</th><th>Created By</th><th>Actions</th></tr></thead>
        <tbody>
            <tr th:each="req : ${requests}">
                <td th:text="${req.id}"></td>
                <td th:text="${req.title}"></td>
                <td><span class="badge" th:classappend="${req.priority == 'HIGH' ? 'bg-danger' : 'bg-secondary'}" th:text="${req.priority}"></span></td>
                <td><span class="badge bg-primary" th:text="${req.status}"></span></td>
                <td th:text="${req.createdBy.fullName}"></td>
                <td><a th:href="@{/requests/{id}(id=${req.id})}" class="btn btn-sm btn-outline-primary">View</a></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
