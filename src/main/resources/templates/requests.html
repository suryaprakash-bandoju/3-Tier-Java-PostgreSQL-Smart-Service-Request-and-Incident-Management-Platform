<!-- FILE: src/main/resources/templates/requests.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests - Service Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="bi bi-headset"></i> ServiceDesk</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/requests">Requests</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Service Requests</h2>
                <p class="text-muted mb-0">Manage and track all IT service requests.</p>
            </div>
            <a href="/requests/new" class="btn btn-primary d-flex align-items-center">
                <i class="bi bi-plus-lg me-2"></i> New Request
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Created By</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="req : ${requests}">
                                <td class="fw-medium text-muted">#<span th:text="${req.id}"></span></td>
                                <td>
                                    <div class="fw-semibold" th:text="${req.title}">Title</div>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${req.priority == 'CRITICAL' ? 'bg-danger' : (req.priority == 'HIGH' ? 'bg-warning' : (req.priority == 'MEDIUM' ? 'bg-info' : 'bg-secondary'))}" 
                                          th:text="${req.priority}">Priority</span>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${req.status == 'OPEN' ? 'bg-warning' : (req.status == 'IN_PROGRESS' ? 'bg-primary' : (req.status == 'RESOLVED' ? 'bg-success' : 'bg-secondary'))}" 
                                          th:text="${#strings.replace(req.status, '_', ' ')}">Status</span>
                                </td>
                                <td class="text-muted" th:text="${req.createdBy.fullName}">User</td>
                                <td class="text-end">
                                    <a th:href="@{/requests/{id}(id=${req.id})}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye me-1"></i> View
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(requests)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                    No service requests found.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
