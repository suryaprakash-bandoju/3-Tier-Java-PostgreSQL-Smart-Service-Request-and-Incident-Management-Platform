<!-- FILE: src/main/resources/templates/request-details.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Details - Service Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="bi bi-headset"></i> ServiceDesk</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/requests">Requests</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <a href="/requests" class="btn btn-sm btn-outline-secondary mb-3">
                    <i class="bi bi-arrow-left me-1"></i> Back to Requests
                </a>

                <div class="card mb-4">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <h3 class="fw-bold mb-1" th:text="${request.title}">Request Title</h3>
                                <p class="text-muted mb-0">Ticket #<span th:text="${request.id}"></span></p>
                            </div>
                            <span class="badge fs-6" 
                                  th:classappend="${request.status == 'OPEN' ? 'bg-warning' : (request.status == 'IN_PROGRESS' ? 'bg-primary' : (request.status == 'RESOLVED' ? 'bg-success' : 'bg-secondary'))}" 
                                  th:text="${#strings.replace(request.status, '_', ' ')}">Status</span>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-4">
                                <p class="text-muted small mb-1">Priority</p>
                                <span class="badge" 
                                      th:classappend="${request.priority == 'CRITICAL' ? 'bg-danger' : (request.priority == 'HIGH' ? 'bg-warning' : (request.priority == 'MEDIUM' ? 'bg-info' : 'bg-secondary'))}" 
                                      th:text="${request.priority}">Priority</span>
                            </div>
                            <div class="col-md-4">
                                <p class="text-muted small mb-1">Requested By</p>
                                <p class="fw-medium mb-0" th:text="${request.createdBy.fullName}">User</p>
                            </div>
                            <div class="col-md-4">
                                <p class="text-muted small mb-1">Created On</p>
                                <p class="fw-medium mb-0" th:text="${#temporals.format(request.createdAt, 'MMM dd, yyyy HH:mm')}">Date</p>
                            </div>
                        </div>

                        <hr>
                        
                        <h6 class="fw-bold mb-2">Description</h6>
                        <p class="text-secondary" th:text="${request.description}">Description text goes here.</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header d-flex align-items-center">
                        <i class="bi bi-chat-left-text me-2"></i> Comments & Updates
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${#lists.isEmpty(request.comments)}" class="text-center text-muted py-3">
                            <i class="bi bi-chat fs-1 d-block mb-2"></i>
                            No comments yet. Start the conversation below.
                        </div>
                        
                        <div th:each="comment : ${request.comments}" class="comment-bubble mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="fw-semibold" th:text="${comment.user.fullName}">User</span>
                                <span class="comment-meta" th:text="${#temporals.format(comment.createdAt, 'MMM dd, yyyy HH:mm')}">Date</span>
                            </div>
                            <p class="mb-0 text-secondary" th:text="${comment.text}">Comment text</p>
                        </div>

                        <hr class="my-4">

                        <form th:action="@{/requests/{id}/comment(id=${request.id})}" th:object="${comment}" method="post">
                            <label for="commentText" class="form-label fw-semibold">Add a comment</label>
                            <div class="input-group">
                                <textarea th:field="*{text}" id="commentText" class="form-control" rows="2" placeholder="Type your message here..." required></textarea>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-send"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
