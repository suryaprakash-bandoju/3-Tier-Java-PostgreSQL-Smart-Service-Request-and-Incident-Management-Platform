<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Request Details</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/dashboard">IT Service Desk</a></div></nav>
<div class="container mt-4">
    <h2 th:text="${request.title}">Title</h2>
    <p class="text-muted" th:text="${request.description}">Description</p>
    <p><strong>Status:</strong> <span class="badge bg-primary" th:text="${request.status}"></span></p>
    
    <hr>
    <h4>Comments</h4>
    <div th:each="comment : ${request.comments}" class="card mb-2">
        <div class="card-body">
            <p class="card-text" th:text="${comment.text}"></p>
            <small class="text-muted" th:text="${comment.user.fullName} + ' on ' + ${comment.createdAt}"></small>
        </div>
    </div>

    <form th:action="@{/requests/{id}/comment(id=${request.id})}" th:object="${comment}" method="post" class="mt-3">
        <div class="mb-3"><textarea th:field="*{text}" class="form-control" placeholder="Add a comment..." required></textarea></div>
        <button type="submit" class="btn btn-primary">Post Comment</button>
    </form>
</div>
</body>
</html>
