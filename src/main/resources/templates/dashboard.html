<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">IT Service Desk</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/requests">My Requests</a>
                <a sec:authorize="hasRole('MANAGER')" class="nav-link" href="/manager/dashboard">Manager View</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">Logout (<span sec:authentication="name">User</span>)</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Welcome, <span th:text="${user.fullName}">User</span></h2>
        <div class="row mt-4">
            <div class="col-md-3"><div class="card text-white bg-warning mb-3"><div class="card-body"><h5>Open</h5><h2 th:text="${stats.open}">0</h2></div></div></div>
            <div class="col-md-3"><div class="card text-white bg-info mb-3"><div class="card-body"><h5>In Progress</h5><h2 th:text="${stats.inProgress}">0</h2></div></div></div>
            <div class="col-md-3"><div class="card text-white bg-success mb-3"><div class="card-body"><h5>Resolved</h5><h2 th:text="${stats.resolved}">0</h2></div></div></div>
            <div class="col-md-3"><div class="card text-white bg-secondary mb-3"><div class="card-body"><h5>Closed</h5><h2 th:text="${stats.closed}">0</h2></div></div></div>
        </div>
    </div>
</body>
</html>
