<!-- FILE: src/main/resources/templates/dashboard.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Service Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-headset"></i> ServiceDesk
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="/dashboard"><i class="bi bi-grid-1x2-fill me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/requests"><i class="bi bi-ticket-detailed me-1"></i> Requests</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('MANAGER')">
                        <a class="nav-link" href="/manager/dashboard"><i class="bi bi-shield-lock me-1"></i> Manager Portal</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-muted d-none d-md-inline">
                        <i class="bi bi-person-circle me-1"></i> <span sec:authentication="name">User</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-logout">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Welcome back, <span th:text="${user.fullName}" class="text-primary">User</span></h2>
                <p class="text-muted mb-0">Here is the current status of the service desk.</p>
            </div>
            <a href="/requests/new" class="btn btn-primary d-none d-md-inline-flex align-items-center">
                <i class="bi bi-plus-lg me-2"></i> New Request
            </a>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card warning h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <p class="text-muted mb-1 fw-medium">Open Requests</p>
                                <h3 class="fw-bold mb-0" th:text="${stats.open}">0</h3>
                            </div>
                            <div class="stat-icon bg-warning-soft">
                                <i class="bi bi-inbox"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card info h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <p class="text-muted mb-1 fw-medium">In Progress</p>
                                <h3 class="fw-bold mb-0" th:text="${stats.inProgress}">0</h3>
                            </div>
                            <div class="stat-icon bg-primary-soft">
                                <i class="bi bi-gear-wide-connected"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card success h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <p class="text-muted mb-1 fw-medium">Resolved</p>
                                <h3 class="fw-bold mb-0" th:text="${stats.resolved}">0</h3>
                            </div>
                            <div class="stat-icon bg-success-soft">
                                <i class="bi bi-check-circle"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card danger h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <p class="text-muted mb-1 fw-medium">Closed</p>
                                <h3 class="fw-bold mb-0" th:text="${stats.closed}">0</h3>
                            </div>
                            <div class="stat-icon bg-danger-soft">
                                <i class="bi bi-archive"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-md-none mb-4">
            <a href="/requests/new" class="btn btn-primary w-100 d-flex align-items-center justify-content-center">
                <i class="bi bi-plus-lg me-2"></i> Create New Request
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
