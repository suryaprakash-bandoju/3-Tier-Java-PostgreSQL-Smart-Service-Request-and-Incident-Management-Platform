<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - Service Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="bi bi-headset"></i> ServiceDesk</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/requests">Requests</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/manager/dashboard">Manager Portal</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="mb-4">
            <h2 class="fw-bold mb-1">Operational Dashboard</h2>
            <p class="text-muted mb-0">Manage assignments, priorities, and track team performance.</p>
        </div>

        <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between">
                <span><i class="bi bi-kanban me-2"></i> All Active Requests</span>
                <span class="badge bg-primary" th:text="${#lists.size(requests)} + ' Total'">Total</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Priority</th>
                                <th>Current Status</th>
                                <th>Assigned To</th>
                                <th class="text-end">Update Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="req : ${requests}">
                                <td class="fw-medium text-muted">#<span th:text="${req.id}"></span></td>
                                <td>
                                    <a th:href="@{/requests/{id}(id=${req.id})}" class="text-decoration-none fw-semibold" th:text="${req.title}">Title</a>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${req.priority == 'CRITICAL' ? 'bg-danger' : (req.priority == 'HIGH' ? 'bg-warning' : (req.priority == 'MEDIUM' ? 'bg-info' : 'bg-secondary'))}" 
                                          th:text="${req.priority}">Priority</span>
                                </td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${#strings.replace(req.status, '_', ' ')}">Status</span>
                                </td>
                                <td class="text-muted" th:text="${req.assignedTo != null ? req.assignedTo.fullName : 'Unassigned'}">Agent</td>
                                <td class="text-end">
                                    <form th:action="@{/manager/requests/{id}/status(id=${req.id})}" method="post" class="d-flex justify-content-end gap-2">
                                        <select name="status" class="form-select form-select-sm" style="width: 150px;">
                                            <option value="OPEN" th:selected="${req.status.name() == 'OPEN'}">Open</option>
                                            <option value="ASSIGNED" th:selected="${req.status.name() == 'ASSIGNED'}">Assigned</option>
                                            <option value="IN_PROGRESS" th:selected="${req.status.name() == 'IN_PROGRESS'}">In Progress</option>
                                            <option value="RESOLVED" th:selected="${req.status.name() == 'RESOLVED'}">Resolved</option>
                                            <option value="CLOSED" th:selected="${req.status.name() == 'CLOSED'}">Closed</option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-primary">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
