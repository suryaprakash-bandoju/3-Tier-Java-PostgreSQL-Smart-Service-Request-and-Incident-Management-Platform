<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Manager Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/dashboard">Manager Portal</a></div></nav>
<div class="container mt-4">
    <h2>Operational Dashboard</h2>
    <table class="table table-bordered mt-3">
        <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Assigned To</th><th>Action</th></tr></thead>
        <tbody>
            <tr th:each="req : ${requests}">
                <td th:text="${req.id}"></td>
                <td th:text="${req.title}"></td>
                <td th:text="${req.status}"></td>
                <td th:text="${req.assignedTo != null ? req.assignedTo.fullName : 'Unassigned'}"></td>
                <td>
                    <form th:action="@{/manager/requests/{id}/status(id=${req.id})}" method="post" class="d-inline">
                        <select name="status" class="form-select form-select-sm d-inline" style="width: auto;">
                            <option value="OPEN">Open</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="RESOLVED">Resolved</option>
                            <option value="CLOSED">Closed</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
